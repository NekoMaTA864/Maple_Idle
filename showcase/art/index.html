<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>楓境手記｜Maple Idle 美術樣張</title>
<style>
:root{color-scheme:dark;--ink:#edf0d7;--dim:#abbcaf;--edge:#344942;--gold:#edc474;--bg:#101b1a;font:16px/1.65 system-ui,"Microsoft JhengHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 25% 5%,#24372f 0,transparent 50%),var(--bg);color:var(--ink);min-height:100vh}main{max-width:1096px;margin:auto;padding:32px 28px 48px}header,footer,.line{display:flex;align-items:center;justify-content:space-between;gap:12px}header{border-bottom:1px solid var(--edge);padding-bottom:18px}.brand,.mono,small,time{font:600 12px/1.5 ui-monospace,Consolas,monospace;letter-spacing:.1em}.brand{display:flex;align-items:center;gap:12px;color:var(--gold)}.mark{width:12px;height:12px;background:var(--gold);box-shadow:4px -4px #a57a4d,-4px 4px #a57a4d}button{font:inherit;color:inherit;background:#1b2c28;border:1px solid #516259;cursor:pointer;border-radius:3px;padding:6px 12px}button:hover,button:focus-visible{border-color:var(--gold);color:var(--gold)}button[aria-pressed=true]{background:#ddbd78;color:#192620;border-color:#ddbd78}h1{font:700 clamp(32px,5vw,54px)/1.1 Georgia,"PMingLiU",serif;letter-spacing:.09em;margin:28px 0 10px}h1+p{color:var(--dim);margin:0 0 22px}.grid{display:grid;grid-template-columns:minmax(0,1.58fr) minmax(260px,1fr);gap:16px}.panel{background:#15231f;border:1px solid var(--edge);padding:20px}.scene{padding:0;overflow:hidden}.scene .line{padding:12px 16px}.scene canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#192e31}.line small,time{color:var(--gold)}h2{font-size:20px;margin:0 0 12px}h3{margin:0;font-size:16px}.effects{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.effects button{min-width:70px}.log{margin:0;padding:0;list-style:none}.log li{padding:12px 0;border-top:1px solid var(--edge);display:grid;grid-template-columns:3.4em 1fr;gap:10px}.hint,footer{font-size:14px;color:var(--dim)}.preview{min-height:3em;margin:8px 0;color:var(--dim)}.replay{width:100%;color:var(--gold)}footer{margin-top:20px;border-top:1px solid var(--edge);padding-top:16px;flex-wrap:wrap}.swatches{display:flex;align-items:center;gap:6px}.swatches i{width:13px;height:13px;background:var(--c)}@media(max-width:740px){main{padding:16px}.grid{grid-template-columns:1fr}.panel{padding:15px}.scene{padding:0}header button{font-size:14px}}
</style>
<main><header><div class="brand"><i class="mark"></i> MAPLE IDLE</div><button id="motion" aria-pressed="false">減少動畫</button></header>
<h1>楓境手記</h1><p>林地哨站 · 美術樣張 01</p>
<div class="grid"><section class="panel scene"><div class="line"><h3>暮色林道</h3><small>FIELD / 01</small></div><canvas width="240" height="104" aria-label="暮色下的松林，左側旅人與右側甲蟲對峙"></canvas><div class="line"><span>巡林旅人</span><span>琥珀甲蟲</span></div></section>
<section class="panel"><h2>試放特效</h2><div class="effects" role="group" aria-label="特效選擇"><button aria-pressed="true">命中</button><button aria-pressed="false">格擋</button><button aria-pressed="false">冰凍</button></div><p class="preview" id="desc"></p><button class="replay" id="play">↻　再次播放</button></section>
<section class="panel"><h2>戰鬥手記</h2><ol class="log" id="log" aria-live="polite"></ol></section>
<section class="panel"><h2>旅途收穫</h2><div class="line"><span>駐留地點</span><strong>林地哨站</strong></div><div class="line"><span>有效時間</span><strong>34 分鐘</strong></div><div class="line"><span>採集所得</span><strong>琥珀碎片 × 3</strong></div><p class="hint">回歸摘要排版示意</p></section></div>
<footer><span>像素輪廓 · 繁中戰報 · 有限色盤</span><div class="swatches" aria-label="森林綠、薄霧灰、琥珀金、霜藍"><i style="--c:#38554a"></i><i style="--c:#abbcaf"></i><i style="--c:#edc474"></i><i style="--c:#9bd9e1"></i></div></footer></main>
<script src="field.js"></script></html>

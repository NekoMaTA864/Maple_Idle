name: Deploy Hero Review Showcase

on:
  workflow_dispatch:
  push:
    branches:
      - feat/hero-vfx-review
    paths:
      - "showcase/**"
      - ".github/workflows/showcase-pages.yml"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hero-review-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload showcase artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: showcase

      - name: Wait for Pages artifact to appear
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq '.total_count') || count=0
            if [ "$count" = 1 ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact did not become available"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

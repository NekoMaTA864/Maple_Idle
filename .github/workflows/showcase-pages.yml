name: Deploy Hero Review Showcase

on:
  workflow_dispatch:
  push:
    branches:
      - feat/hero-vfx-review
      - feat/night-lord-vfx-slice
    paths:
      - "showcase/**"
      - ".github/workflows/showcase-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hero-review-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload showcase artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: showcase

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
